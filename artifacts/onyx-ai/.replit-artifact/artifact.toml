kind = "web"
previewPath = "/"
title = "Onyx AI"
version = "1.0.0"
id = "artifacts/onyx-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25387

[services.development]
run = "pnpm --filter @workspace/onyx-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/onyx-ai", "run", "build" ]
publicDir = "artifacts/onyx-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25387"
BASE_PATH = "/"
