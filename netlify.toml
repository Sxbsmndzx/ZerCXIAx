# ─────────────────────────────────────────────────────────────────────────────
# Netlify — ZerCX AI (frontend only)
# Backend stays on Replit: https://onyx-core--migatitosusu.replit.app
# ─────────────────────────────────────────────────────────────────────────────

[build]
  # Run from the repo root so pnpm workspace packages resolve correctly
  command   = "pnpm install --frozen-lockfile && pnpm --filter @workspace/onyx-ai run build"
  publish   = "artifacts/onyx-ai/dist/public"

[build.environment]
  NODE_VERSION  = "20"
  # PORT is not used during `vite build`, but kept here to avoid any startup guard
  PORT          = "3000"
  # BASE_PATH defaults to "/" in vite.config.ts; set explicitly for clarity
  BASE_PATH     = "/"
  # Supabase + API — set real values in Netlify dashboard → Site settings → Env vars
  # VITE_SUPABASE_URL     = set in Netlify dashboard
  # VITE_SUPABASE_ANON_KEY = set in Netlify dashboard (safe — it's the public anon key)
  # VITE_API_BASE_URL     = https://onyx-core--migatitosusu.replit.app

# Guard rail: the backend lives on Replit (VITE_API_BASE_URL), so no request
# should ever reach this site under /api/*. If one does (e.g. the env var is
# missing for a deploy context), fail with a real 404 instead of letting the
# SPA fallback below silently return index.html with a 200 status — that
# masked failure is what previously crashed the app after login.
[[redirects]]
  from   = "/api/*"
  to     = "/index.html"
  status = 404

# SPA fallback — all routes served by index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
